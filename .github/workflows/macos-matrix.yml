# Builds and tests macpow on every macOS version GitHub hosts for Apple Silicon,
# and reports which data it really obtained there.
#
# GitHub's macOS runners are virtual machines on Apple M1 hosts, whatever the
# label: the chip cannot be chosen, and IOReport, the SMC, the battery and the
# display are absent. So this matrix covers macOS versions, not chips. The
# build and the hermetic tests fail the job; the hardware tests and the probe
# are informational and only show what a guest exposes.
name: macOS matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-matrix-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Free arm64 images: macOS 15, macOS 26 and macOS 27.
        runner: [macos-15, macos-26, xcode-27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Rust release that rust-toolchain.toml pins.
      - run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --locked --lib --bins --test cf_utils --test cli

      - name: Hardware tests (informational)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p out
          cargo test --locked --test integration -- --test-threads=1 2>&1 | tee out/hardware-tests.txt

      - name: Probe
        timeout-minutes: 5
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: bash .github/scripts/probe.sh target/release/macpow out "$RUNNER_LABEL"

      - name: Report
        run: python3 -I .github/scripts/coverage.py out | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.runner }}
          path: out/
          retention-days: 14

  report:
    name: Coverage across the matrix
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports

      - name: Report
        run: python3 -I .github/scripts/coverage.py reports/* | tee -a "$GITHUB_STEP_SUMMARY"
